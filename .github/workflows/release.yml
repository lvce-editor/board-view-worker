name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  create-prerelease:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      upload-url: ${{ steps.release.outputs.upload_url }}
    steps:
      - id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true

  build-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: create-prerelease
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
      GIT_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - run: npm run install:chromium --workspace=@lvce-editor/board-view-build -- --with-deps
      - run: npm run e2e:headless
      - run: npm run check:package
      - uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: release
          path: |
            dist/
            extension.tar.br
  publish-github:
    needs: [create-prerelease, build-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release
          path: release
      - name: Attach archive to draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          UPLOAD_URL: ${{ needs.create-prerelease.outputs.upload-url }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary @release/extension.tar.br \
            "${UPLOAD_URL%%\{*}?name=board-view-worker-${TAG}.tar.br"
  publish-npm:
    needs: [build-release, publish-github]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release
          path: release
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public --provenance
        # eslint-disable-next-line github-actions/working-directory
        working-directory: release/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  finalize-release:
    needs: [create-prerelease, publish-github, publish-npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft as the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-prerelease.outputs.release-id }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F prerelease=false -f make_latest=true
